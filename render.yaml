databases:
  - name: events-db
    plan: free
    databaseName: events_db
    user: events
    region: singapore

services:
  - type: web
    name: events-api
    runtime: node
    plan: free
    region: singapore
    rootDir: events-api
    buildCommand: npm install && npm run build
    startCommand: node dist/seed && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: events-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SEED_EMAIL
        value: demo@rescuerituals.dev
      - key: SEED_PASSWORD
        value: demo1234
      - key: SELF_URL
        sync: false

  - type: web
    name: events-web
    runtime: static
    rootDir: events-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
